name: Android CI

# Three jobs:
#   verify-pin — core pin bumps ONLY. Seconds, no build. See its own note.
#   check      — unit tests + lint. Gates the build.
#   build      — assembles an APK on pushes and pull requests; publishes a GitHub Release on v* tags.
on:
  push:
    branches: [ main, feature/native-vpn ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_core_source:
        description: 'Build core from source, as a fork pull request does (ignores GPR_TOKEN)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pin:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The pin must be core's newest release, and locales.json must match it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PIN=$(sed -n 's/^owntvCore = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          [ -n "$PIN" ] || { echo "::error::Could not read owntvCore from gradle/libs.versions.toml."; exit 1; }
          if [ "$HEAD_BRANCH" != "bump/core-$PIN" ]; then echo "::error::Branch $HEAD_BRANCH does not match the pin $PIN."; exit 1; fi
          LATEST=$(gh api repos/ahXN00/OwnTV_Core/releases/latest --jq .tag_name)
          LATEST="${LATEST#core-}"
          if [ "$PIN" != "$LATEST" ]; then echo "::error::Pinned $PIN but core's newest release is $LATEST."; exit 1; fi
          curl -fsSL -o /tmp/locales.core.json "https://raw.githubusercontent.com/ahXN00/OwnTV_Core/core-$PIN/tools/i18n/locales.json"
          diff -u /tmp/locales.core.json tools/i18n/locales.json
          echo "Pin $PIN is core's newest release, the branch agrees, and locales.json matches."

  check:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve core
        uses: ./.github/actions/resolve-core
        with:
          force-source-build: ${{ inputs.force_core_source || false }}
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace
      - name: Lint
        if: always()
        run: ./gradlew lintStandardDebug --stacktrace
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-')) }}
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve core
        uses: ./.github/actions/resolve-core
        with:
          force-source-build: ${{ inputs.force_core_source || false }}
      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi
      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --stacktrace
            ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
            X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
            echo "X86_SRC=$X86_SRC" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug --stacktrace
            ARM_SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
          fi
      - name: Name the APK
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            OUT="OwnTV-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="OwnTV-standard-debug-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          if [ "$IS_TAG" = "true" ]; then
            cp "$ARM_SRC" "dist/OwnTV.apk"
            if [ -n "$X86_SRC" ]; then cp "$X86_SRC" "dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"; fi
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error
      - name: Extract release notes from CHANGELOG_APP.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '$0 ~ ("^## " ver "([ \t]|$)") { flag=1; next } /^## v/ && flag { flag=0 } flag { print }' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then echo "See CHANGELOG.md for details." > dist/RELEASE_NOTES.md; fi
      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OwnTV ${{ github.ref_name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/OwnTV.apk
            dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
# Trigger a fresh native-VPN APK build from this branch.
