name: Build APK

on:
  push:
    branches:
      - feature/native-vpn
  workflow_dispatch:
    inputs:
      force_core_source:
        description: 'Build core from source instead of GitHub Packages'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

# Standard debug APK for the current feature branch; push builds keep the downloadable artifact current.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standard Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve core
        uses: ./.github/actions/resolve-core
        with:
          force-source-build: ${{ inputs.force_core_source || false }}

      - name: Build Standard Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug --stacktrace --console=plain

      - name: Package APK
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n 1)
          cp "$APK" "dist/OwnTV-standard-debug-${GITHUB_SHA::7}.apk"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OwnTV-standard-debug-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
