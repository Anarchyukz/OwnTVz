name: Apply UI fixes

on:
  push:
    branches: [feature/native-vpn]

permissions:
  contents: write

jobs:
  fix:
    if: !startsWith(github.event.head_commit.message, 'Apply UI fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-vpn
          fetch-depth: 0

      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) EPG: keep only the fifth UK preset, which is the one confirmed working.
          p = Path('app/src/main/java/tv/own/owntv/features/settings/EpgSourcesScreen.kt')
          s = p.read_text()
          old = '''    val presets = listOf(\n        stringResource(R.string.settings_epg_uk_preset_name, 1) to stringResource(R.string.settings_epg_uk_preset_url_1),\n        stringResource(R.string.settings_epg_uk_preset_name, 2) to stringResource(R.string.settings_epg_uk_preset_url_2),\n        stringResource(R.string.settings_epg_uk_preset_name, 3) to stringResource(R.string.settings_epg_uk_preset_url_3),\n        stringResource(R.string.settings_epg_uk_preset_name, 4) to stringResource(R.string.settings_epg_uk_preset_url_4),\n        stringResource(R.string.settings_epg_uk_preset_name, 5) to stringResource(R.string.settings_epg_uk_preset_url_5),\n    )'''
          new = '''    val presets = listOf(\n        stringResource(R.string.settings_epg_uk_preset_name, 5) to stringResource(R.string.settings_epg_uk_preset_url_5),\n    )'''
          if old not in s: raise SystemExit('EPG preset block not found')
          p.write_text(s.replace(old, new))

          # 2) Sidebar: remove the stray BROWSE label that is rendered beside the Series row.
          p = Path('app/src/main/java/tv/own/owntv/features/shell/components/Sidebar.kt')
          s = p.read_text()
          old = '''            if (expanded) {\n                SectionLabel(stringResource(R.string.common_browse))\n                Spacer(Modifier.height(4.dp))\n            }\n\n            Column(modifier = Modifier.fillMaxWidth()) {'''
          new = '''            Column(modifier = Modifier.fillMaxWidth()) {'''
          if old not in s: raise SystemExit('Sidebar BROWSE block not found')
          s = s.replace(old, new)
          s = s.replace('.width(188.dp)', '.width(240.dp)', 1)
          old_logo = '''private fun AppLogo(modifier: Modifier = Modifier) {\n    val colors = OwnTVTheme.colors\n    Box(\n        modifier = modifier\n            .size(56.dp)\n            .clip(RoundedCornerShape(20.dp))\n            .border(width = 2.dp, color = colors.primary, shape = RoundedCornerShape(20.dp)),\n        contentAlignment = Alignment.Center,\n    ) {\n        OwnTVIcon(icon = OwnTVIcon.PLAY, tint = colors.primary, modifier = Modifier.size(26.dp), filled = true)\n    }\n}'''
          new_logo = '''private fun AppLogo(modifier: Modifier = Modifier) {\n    val colors = OwnTVTheme.colors\n    Row(\n        modifier = modifier.fillMaxWidth().padding(horizontal = 4.dp),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.Center,\n    ) {\n        Box(\n            modifier = Modifier\n                .size(46.dp)\n                .clip(RoundedCornerShape(16.dp))\n                .background(colors.primary.copy(alpha = 0.16f))\n                .border(width = 2.dp, color = colors.primary, shape = RoundedCornerShape(16.dp)),\n            contentAlignment = Alignment.Center,\n        ) {\n            OwnTVIcon(icon = OwnTVIcon.PLAY, tint = colors.primary, modifier = Modifier.size(24.dp), filled = true)\n        }\n        Spacer(Modifier.width(10.dp))\n        Text(\n            "OwnTVz",\n            style = MaterialTheme.typography.headlineSmall,\n            color = colors.onSurface,\n            fontWeight = FontWeight.Bold,\n        )\n    }\n}'''
          if old_logo not in s: raise SystemExit('Sidebar logo block not found')
          p.write_text(s.replace(old_logo, new_logo))

          # 3) TV licence warning: show it as soon as the Free UK TV list is entered, before playback.
          p = Path('app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt')
          s = p.read_text()
          marker = '''    fun dismissUkTvLicense() {\n        _ukTvLicenseRequired.value = null\n    }'''
          addition = '''    fun dismissUkTvLicense() {\n        _ukTvLicenseRequired.value = null\n    }\n\n    /** Show the licence notice when the Free UK TV section is opened, before a channel is played. */\n    fun maybeShowUkTvLicense(channel: ChannelEntity?) {\n        if (channel == null || FreeUkTv.isAcknowledged(appContext) || _ukTvLicenseRequired.value != null) return\n        viewModelScope.launch {\n            val source = getSource(channel.sourceId)\n            if (source?.url == FreeUkTv.PLAYLIST_URL ||\n                source?.name == appContext.getString(R.string.free_uk_tv_name)) {\n                _ukTvLicenseRequired.value = channel\n            }\n        }\n    }'''
          if marker not in s: raise SystemExit('Licence method marker not found')
          p.write_text(s.replace(marker, addition, 1))

          # 4) Call the licence check when the first channel becomes available in the selected section.
          p = Path('app/src/main/java/tv/own/owntv/features/live/LiveScreen.kt')
          s = p.read_text()
          marker = '''    val loadedChannels = channels.itemSnapshotList.items.filterNotNull()\n    LaunchedEffect(loadedChannels.size, loadedChannels.firstOrNull()?.id, loadedChannels.lastOrNull()?.id) {'''
          replacement = '''    val loadedChannels = channels.itemSnapshotList.items.filterNotNull()\n    LaunchedEffect(selectedKey, loadedChannels.firstOrNull()?.id) {\n        vm.maybeShowUkTvLicense(loadedChannels.firstOrNull())\n    }\n    LaunchedEffect(loadedChannels.size, loadedChannels.firstOrNull()?.id, loadedChannels.lastOrNull()?.id) {'''
          if marker not in s: raise SystemExit('LiveScreen channel marker not found')
          p.write_text(s.replace(marker, replacement, 1))

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/tv/own/owntv/features/settings/EpgSourcesScreen.kt app/src/main/java/tv/own/owntv/features/shell/components/Sidebar.kt app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt app/src/main/java/tv/own/owntv/features/live/LiveScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply UI fixes and Free UK TV warning'
          git push origin HEAD:feature/native-vpn
